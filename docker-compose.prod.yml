name: proxmos-bot-prod

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Docker/Dockerfile.prod
    env_file: .env.prod
    depends_on:
      - mongo
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Docker/Dockerfile.prod
    env_file: .env.prod
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:

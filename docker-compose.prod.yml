name: proxmos-bot-prod

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Docker/Dockerfile.prod
    env_file: .env.prod
    depends_on:
      - mongo
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Docker/Dockerfile.prod
    env_file: .env.prod
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ./app
      dockerfile: Docker/Dockerfile.prod
    env_file: .env.prod
    environment:
      API_BASE_URL: http://api:8000
      HOST: 0.0.0.0
      PORT: 3000
      BODY_SIZE_LIMIT: Infinity
    # LAN IP LXC/хоста — upstream для NPM (замените на свой)
    ports:
      - "192.168.1.33:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:

# Telegraf: температура всех дисков в Influx (bucket hardware)

# Проблема: inputs.temp даёт один nvme_composite на оба NVMe (одинаковые имена hwmon).
# Решение: SMART по каждому /dev/* с полем device=nvme0|nvme1|sda|sdb.

[[inputs.smart]]
  path_smartctl = "/usr/sbin/smartctl"
  devices = ["/dev/nvme0", "/dev/nvme1", "/dev/sda", "/dev/sdb"]
  timeout = "30s"
  attributes = true

[[outputs.influxdb_v2]]
  urls = ["http://192.168.1.148:8086"]
  organization = "homelab"
  bucket = "hardware"
  # token via env or separate file — не коммитить секреты
  namepass = ["temp", "smart_device"]

# После правки:
#   systemctl restart telegraf
# Проверка в Influx:
#   smart_device + device=nvme0/nvme1 + поля с "temp" в имени

name: CI

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Python lint (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, bot, mock]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
      - uses: ./.github/actions/setup-python
        with:
          package: ${{ matrix.package }}
      - name: Install Ruff
        run: python -m pip install "ruff>=0.9"
      - name: Ruff check
        working-directory: ${{ matrix.package }}
        run: ruff check .
      - name: Ruff format
        working-directory: ${{ matrix.package }}
        run: ruff format --check .

  test-python:
    name: Python tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [backend, bot, mock]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
      - uses: ./.github/actions/setup-python
        with:
          package: ${{ matrix.package }}
      - name: Pytest
        working-directory: ${{ matrix.package }}
        run: pytest -q

  lint-app:
    name: Mini App lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
      - uses: ./.github/actions/setup-app
      - name: ESLint
        working-directory: app
        run: npm run lint

  test-app:
    name: Mini App tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
      - uses: ./.github/actions/setup-app
      - name: Vitest
        working-directory: app
        run: npm test

  check-app:
    name: Mini App typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
      - uses: ./.github/actions/setup-app
      - name: svelte-check
        working-directory: app
        run: npm run check

  build-app:
    name: Mini App build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
      - uses: ./.github/actions/setup-app
      - name: Build
        working-directory: app
        run: npm run build

  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - lint-python
      - test-python
      - lint-app
      - test-app
      - check-app
      - build-app
    if: always()
    steps:
      - name: Verify required jobs
        env:
          LINT_PYTHON: ${{ needs.lint-python.result }}
          TEST_PYTHON: ${{ needs.test-python.result }}
          LINT_APP: ${{ needs.lint-app.result }}
          TEST_APP: ${{ needs.test-app.result }}
          CHECK_APP: ${{ needs.check-app.result }}
          BUILD_APP: ${{ needs.build-app.result }}
        run: |
          failed=0
          for pair in \
            "lint-python:$LINT_PYTHON" \
            "test-python:$TEST_PYTHON" \
            "lint-app:$LINT_APP" \
            "test-app:$TEST_APP" \
            "check-app:$CHECK_APP" \
            "build-app:$BUILD_APP"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != "success" ]; then
              echo "::error::$name finished with $result (required: success)"
              failed=1
            fi
          done
          exit "$failed"

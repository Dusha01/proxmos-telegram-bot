name: Setup Python package
description: Install Python deps for backend, bot, or mock

inputs:
  package:
    description: backend | bot | mock
    required: true
  install-dev:
    description: Install requirements-dev.txt
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          ${{ inputs.package }}/requirements.txt
          ${{ inputs.package }}/requirements-dev.txt

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.package }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ "${{ inputs.install-dev }}" = "true" ]; then
          pip install -r requirements-dev.txt
        fi

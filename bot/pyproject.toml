[project]
name = "proxmos-bot-telegram"
version = "0.1.0"
description = "Telegram bot for Proxmox administration"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31",
    "aiohttp-socks>=0.9",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

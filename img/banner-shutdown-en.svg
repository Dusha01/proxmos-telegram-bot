    <clipPath id="card">
      <rect width="1200" height="96" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="96" fill="#1c1408"/>
    <rect width="12" height="96" fill="#f5a524"/>
    <text x="40" y="40" fill="#fbbf24" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="15" font-weight="700">DO NOT SKIM</text>
    <text x="40" y="70" fill="#fef3c7" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="26" font-weight="700">Power off the node and this remote dies with it</text>
  </g>
</svg>

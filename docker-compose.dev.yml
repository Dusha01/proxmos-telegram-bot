name: proxmos-bot-dev

services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  proxmox-mock:
    build:
      context: ./mock
      dockerfile: Docker/Dockerfile.prod
    env_file:
      - ./mock/.env.example
    ports:
      - "127.0.0.1:8006:8006"

volumes:
  mongo_data:
  